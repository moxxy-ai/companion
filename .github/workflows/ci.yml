name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run scanners against fresh advisory databases even when the source did
  # not change. A green build from last month is not current vulnerability
  # evidence.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm security:workflow-policy
      - run: pnpm install --frozen-lockfile

      # The dependency-review job below stops a vulnerable package entering a
      # pull request. This scan also catches a newly disclosed vulnerability in
      # an unchanged production lockfile during the weekly run.
      - run: pnpm audit --prod --audit-level high

      # Release discovery reads the same public/private package boundary as the
      # Version workflow. This catches a malformed public manifest in the pull
      # request instead of after CI when Publish builds its dynamic matrix.
      - run: pnpm release:packages

      # The module registries are generated from profiles/*.json and gitignored.
      # Build before typecheck (topological order: @companion/contract emits its
      # types before api/web typecheck against them).
      # Build the FULL profile first: it is the superset, so every module's code
      # is compiled and every dist/ the later steps need exists.
      - run: pnpm gen:modules --profile full
      - run: pnpm -r build
      - run: pnpm release:dependencies
      - run: pnpm -r typecheck

      # Framework + module tests. `packages/core` and `packages/services` cover
      # the logic with no daemon to drive it: the RBAC fold ordering, the licence
      # gate's fail-closed paths and the single-instance lock. Each of those was
      # verified by hand once; the tests are what keep it verified.
      - run: pnpm -r test

      # RBAC gate: the three permission declaration sites must agree, ids must
      # be unique across modules, and any change to the effective grid must be
      # reflected in docs/acl-grid.json so it shows up in review. Needs dist/,
      # so it runs after the build.
      - run: pnpm acl check

      # ABI gate: `@moxxy/companion-sdk` is a published surface, so a symbol
      # must not leave it by accident. `/ui` is a wildcard re-export, which makes
      # deleting a shared component a silent break for external modules.
      - run: pnpm sdk:surface

      # `minimal` is core + workspace, the two required modules. If the shell
      # compiles against it, it compiles against every profile, so this is the
      # regression guard for "the shell depends on no optional module".
      - run: pnpm gen:modules --profile minimal
      - run: pnpm -r typecheck

  # The Docker image is the deployment path, and nothing above exercises it.
  # A rename of the CLI package once made `pnpm --filter` match nothing, which
  # exits 0, so the image built empty and failed three steps later on a COPY.
  # Every workspace check still passed. This job is that gap closed: it builds
  # the image the way a deploy does, then asks the running container what it
  # actually contains.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the full image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: PROFILE=full
          load: true
          tags: companion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep unfixed findings visible in the run even though they cannot yet be
      # remediated. The second pass is the release-blocking subset.
      - name: Report all high and critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: companion:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "0"
          timeout: 15m

      - name: Block fixed high and critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: companion:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          timeout: 15m

      # A build that produces an image which cannot boot is not a passing build.
      - name: Boot it and check the module set
        run: |
          docker run -d --name companion-ci -p 8901:8901 \
            -e COMPANION_ADMIN_USER=ci -e COMPANION_ADMIN_PASSWORD='CorrectHorse1!' companion:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8901/healthz >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8901/healthz >/dev/null || { docker logs companion-ci; exit 1; }
          # `companion` must be on PATH: every runbook in the README uses it.
          docker exec companion-ci companion module list | tee /tmp/modules.txt
          # Every module of the profile has to be IN the image. How many of them
          # boot enabled is each manifest's autoInstall and says nothing about
          # the build arg, which is what a count of enabled ones was reading:
          # optional modules may land as Available. Take the expectation from
          # profiles/ rather than a count, so adding a module updates this check
          # with it.
          expected=$(node -e '
            const read = (n) => JSON.parse(require("node:fs").readFileSync(`profiles/${n}.json`, "utf8"));
            const ids = (n) => { const p = read(n); return [...(p.extends ? ids(p.extends) : []), ...p.modules]; };
            console.log(ids("full").join(" "));
          ')
          for id in $expected; do
            grep -qE "^$id[[:space:]]" /tmp/modules.txt || {
              echo "module '$id' is not in the image; the PROFILE build arg did not take effect"
              exit 1
            }
          done
          echo "all $(echo "$expected" | wc -w) modules of the full profile are in the image"

  # The dependency graph is evaluated before code lands. Development
  # dependencies count too: a compromised build tool can alter the artifact as
  # effectively as a vulnerable runtime package.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review changed dependencies and licences
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: true
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, SSPL-1.0, BUSL-1.1
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: "3"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyse JavaScript and TypeScript
        uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
